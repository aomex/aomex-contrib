name: Test

on:
  push:
    branches-ignore:
      - main
      - develop
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24.x, 26.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node }}
          cache: true
          install: false
      - run: pnpm install
      - run: pnpm test
